name: clair obscur tests

on:
  push:
    paths:
      - "worlds/clair_obscur/**"
      - ".github/workflows/clair-obscur-tests.yml"
  pull_request:
    paths:
      - "worlds/clair_obscur/**"
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    name: Python ${{ matrix.python }} on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          python Launcher.py --update_settings

      - name: Tests
        env:
          AP_TEST_WORLDS: clair_obscur
          PYTHONHASHSEED: "0"
        run: pytest -n auto